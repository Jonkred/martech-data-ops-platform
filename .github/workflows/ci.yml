name: Data Engineering CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & dbt Tools
        run: |
          pip install ruff sqlfluff dbt-core dbt-postgres

      - name: Python Code Linting
        run: |
          ruff check .

      - name: SQLFluff Linting
        run: |
          sqlfluff lint dbt_project/models/ --dialect postgres || true