martech_profile:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'data_engineer') }}"
      password: "{{ env_var('DB_PASS', 'devpassword') }}"
      port: 5432
      dbname: "{{ env_var('DB_NAME', 'analytics_dw') }}"
      schema: public
      threads: 4